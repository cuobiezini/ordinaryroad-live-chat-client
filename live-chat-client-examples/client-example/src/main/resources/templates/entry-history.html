<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入场记录管理 - 直播弹幕客户端管理系统</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .checkbox-cell {
            width: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 入场记录管理</h1>
            <p>Live Entry History Management</p>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="/" class="nav-link">📊 总览</a>
                <a href="/entry-history" class="nav-link active">📥 入场记录</a>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="user-info" style="color: #666; font-size: 14px;"></span>
                <a href="/logout" class="btn btn-danger" style="padding: 8px 20px; text-decoration: none; display: inline-block;">🚪 退出登录</a>
            </div>
        </div>

        <!-- 筛选条件 -->
        <div class="filter-section">
            <h2>🔍 查询条件</h2>
            <div class="filter-form">
                <div class="form-group">
                    <label>直播间ID</label>
                    <input type="text" id="filter-roomId" placeholder="输入直播间ID">
                </div>
                <div class="form-group">
                    <label>平台</label>
                    <select id="filter-platform">
                        <option value="">全部</option>
                        <option value="douyin">抖音</option>
                        <option value="kuaishou">快手</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>开始时间</label>
                    <input type="datetime-local" id="filter-startTime">
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" id="filter-endTime">
                </div>
                <div class="button-group" style="margin-top: 0;">
                    <button class="btn btn-primary" onclick="EntryHistoryUI.searchEntries()">🔍 查询</button>
                    <button class="btn btn-warning" onclick="EntryHistoryUI.resetFilters()">🔄 重置</button>
                    <button class="btn btn-success" onclick="EntryHistoryUI.exportCsv()">📥 导出CSV</button>
                </div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">📋 入场记录列表</h2>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 8px 16px; border-radius: 8px; font-size: 14px;">
                        <span style="font-size: 12px; opacity: 0.9;">总记录数</span>
                        <span id="total-count" style="font-size: 20px; font-weight: bold; margin-left: 8px;">0</span>
                    </div>
                    <div>
                        <button class="btn btn-info btn-sm" onclick="EntryHistoryUI.fetchDisplayId()">🔍 取数（抖音）</button>
                        <button class="btn btn-success btn-sm" onclick="EntryHistoryUI.batchMarkAsUsed()">✓ 批量标记为已使用</button>
                        <button class="btn btn-danger btn-sm" onclick="EntryHistoryUI.batchDelete()">🗑️ 批量删除</button>
                        <button class="btn btn-warning btn-sm" onclick="EntryHistoryUI.showCleanDialog()">🧹 清理旧数据</button>
                    </div>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell"><input type="checkbox" id="selectAll" onchange="EntryHistoryUI.toggleSelectAll()"></th>
                        <th>ID</th>
                        <th>平台</th>
                        <th>直播间ID</th>
                        <th>用户昵称</th>
                        <th>抖音号</th>
                        <th>是否已使用</th>
                        <th>进入时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="10" style="text-align: center; padding: 40px;">
                            加载中...
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination" id="pagination">
                <!-- 分页控件将通过JavaScript动态生成 -->
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="log-section">
            <h2>📋 操作日志</h2>
            <div class="log-container" id="log-container">
                <div class="log-entry log-info">系统已就绪，等待操作...</div>
            </div>
        </div>
    </div>

    <!-- 清理所有数据模态对话框 -->
    <div id="cleanDataModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);" onclick="if(event.target === this) closeCleanModal()">
        <div style="background: white; border-radius: 16px; padding: 0; max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalSlideIn 0.3s ease-out; overflow: hidden;">
            <!-- 头部 -->
            <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 24px 30px; color: white;">
                <h3 style="margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px;">
                     清理所有数据
                </h3>
                <p style="margin: 8px 0 0 0; font-size: 13px; opacity: 0.9;">删除所有历史入场记录</p>
            </div>
            
            <!-- 内容区 -->
            <div style="padding: 30px;">
                <div style="background: #fff3cd; border-left: 4px solid #f5576c; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
                    <p style="margin: 0; font-size: 14px; color: #856404; line-height: 1.6;">
                        ⚠️ <strong>警告：</strong>此操作将永久删除<strong>所有</strong>入场记录，无法恢复！请谨慎操作。
                    </p>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <p style="margin: 0 0 8px 0; font-size: 13px; color: #666; font-weight: 500;">📊 当前数据统计：</p>
                    <p style="margin: 0; font-size: 14px; color: #333;">
                        总记录数：<strong id="modalTotalCount" style="color: #667eea;">加载中...</strong>
                    </p>
                </div>
            </div>
            
            <!-- 底部按钮 -->
            <div style="padding: 20px 30px; background: #f8f9fa; display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="closeCleanModal()" class="btn btn-secondary" style="flex: 1; max-width: 120px;">
                    取消
                </button>
                <button onclick="EntryHistoryUI.confirmCleanAllData()" class="btn btn-danger" style="flex: 1; max-width: 120px;">
                    确认清理
                </button>
            </div>
        </div>
    </div>

    <!-- 通用确认对话框 -->
    <div id="confirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(4px);" onclick="if(event.target === this) closeConfirmModal()">
        <div style="background: white; border-radius: 16px; padding: 0; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalSlideIn 0.3s ease-out; overflow: hidden;">
            <!-- 头部 -->
            <div id="confirmModalHeader" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px 25px; color: white;">
                <h3 id="confirmModalTitle" style="margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px;">
                    确认操作
                </h3>
            </div>
            
            <!-- 内容区 -->
            <div style="padding: 25px 30px;">
                <div id="confirmModalWarning" style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px 15px; margin-bottom: 20px; border-radius: 4px; display: none;">
                    <p id="confirmModalWarningText" style="margin: 0; font-size: 14px; color: #856404; line-height: 1.5;">
                    </p>
                </div>
                
                <p id="confirmModalMessage" style="margin: 0; font-size: 15px; color: #333; line-height: 1.6;">
                </p>
                
                <div id="confirmModalExtra" style="margin-top: 15px; display: none;">
                </div>
            </div>
            
            <!-- 底部按钮 -->
            <div style="padding: 18px 25px; background: #f8f9fa; display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="closeConfirmModal()" class="btn btn-secondary" style="flex: 1; max-width: 100px;">
                    取消
                </button>
                <button id="confirmModalBtn" class="btn btn-primary" style="flex: 1; max-width: 100px;">
                    确定
                </button>
            </div>
        </div>
    </div>

    <!-- 动画样式 -->
    <style>
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>

    <script th:src="@{/js/admin.js}"></script>
    <script th:src="@{/js/entry-history-manager.js}"></script>
    <script th:src="@{/js/entry-history-api.js}"></script>
    <script th:src="@{/js/entry-history-ui.js}"></script>
</body>
</html>

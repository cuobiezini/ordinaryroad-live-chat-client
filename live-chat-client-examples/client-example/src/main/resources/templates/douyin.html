<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音配置 - 直播弹幕客户端管理系统</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚫ 抖音直播间配置</h1>
            <p>Douyin Live Chat Client Configuration</p>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="/" class="nav-link">📊 总览</a>
                <a href="/bilibili" class="nav-link">🟣 B站</a>
                <a href="/douyu" class="nav-link">🔴 斗鱼</a>
                <a href="/kuaishou" class="nav-link">🟠 快手</a>
                <a href="/douyin" class="nav-link active">⚫ 抖音</a>
            </div>
        </div>

        <!-- 平台配置卡片 -->
        <div class="dashboard">
            <div class="platform-card" style="cursor: default;">
                <div class="platform-header">
                    <div class="platform-name">⚫ 抖音 (Douyin)</div>
                    <span class="status-badge status-disconnected" id="status-douyin">未连接</span>
                </div>
                
                <div class="form-group">
                    <label for="roomId-douyin">直播间ID</label>
                    <input type="text" id="roomId-douyin" placeholder="输入抖音直播间ID，例如: 732385677810">
                </div>
                
                <div class="form-group">
                    <label for="cookie-douyin">Cookie（可选）</label>
                    <input type="password" id="cookie-douyin" placeholder="输入浏览器Cookie，用于身份验证">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="autoReconnect-douyin" checked>
                        自动重连
                    </label>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-success" onclick="saveConfig('douyin')" id="btn-save-douyin">
                        💾 保存配置
                    </button>
                    <button class="btn btn-primary" onclick="connectClient('douyin')" id="btn-connect-douyin">
                         连接
                    </button>
                    <button class="btn btn-danger" onclick="disconnectClient('douyin')" id="btn-disconnect-douyin" disabled>
                         断开
                    </button>
                    <button class="btn btn-warning" onclick="reconnectClient('douyin')" id="btn-reconnect-douyin">
                        🔄 重连
                    </button>
                </div>
            </div>

            <!-- 批量连接房间 -->
            <div class="platform-card" style="margin-top: 20px;">
                <div class="platform-header">
                    <div class="platform-name">🔗 批量连接房间</div>
                    <span style="color: #999; font-size: 0.85em;">支持同时连接多个直播间</span>
                </div>
                
                <div class="form-group">
                    <label for="batch-roomIds-douyin">房间ID列表（每行一个）</label>
                    <textarea id="batch-roomIds-douyin" rows="6" placeholder="请输入房间ID，每行一个，例如：&#10;732385677810&#10;732385677811&#10;732385677812" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; resize: vertical; transition: border-color 0.3s; font-family: 'Courier New', monospace;" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e0e0e0'"></textarea>
                    <small style="color: #999; display: block; margin-top: 5px;">💡 提示：直接粘贴房间ID列表</small>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-primary" onclick="batchConnectRooms('douyin')">
                        🚀 批量连接
                    </button>
                    <button class="btn btn-secondary" onclick="loadBatchStatus('douyin')">
                         刷新状态
                    </button>
                    <button class="btn btn-danger" onclick="disconnectAllRooms('douyin')">
                         全部断开
                    </button>
                </div>
            </div>

            <!-- 批量连接状态展示 -->
            <div class="platform-card" style="margin-top: 20px;">
                <div class="platform-header">
                    <div class="platform-name">📊 批量连接状态</div>
                    <span id="batch-status-count" style="color: #999; font-size: 0.85em;">共 0 个房间</span>
                </div>
                
                <div id="batch-status-container" style="max-height: 400px; overflow-y: auto;">
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <p>暂无批量连接的房间</p>
                        <p style="font-size: 0.85em; margin-top: 10px;">点击“批量连接”按钮开始连接房间</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 入场记录查询 -->
        <div class="log-section">
            <h2>📥 入场记录查询</h2>
            <div style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <!-- 统计信息 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span id="entry-total-count" style="color: #666; font-size: 14px;">总记录数: 0</span>
                </div>
                
                <!-- 筛选条件 -->
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end;">
                        <div>
                            <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">直播间ID</label>
                            <input type="text" id="entry-filter-roomId" placeholder="输入直播间ID" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">用户昵称</label>
                            <input type="text" id="entry-filter-username" placeholder="模糊搜索" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">开始时间</label>
                            <input type="datetime-local" id="entry-filter-startTime" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">结束时间</label>
                            <input type="datetime-local" id="entry-filter-endTime" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                        </div>
                        <div>
                            <button onclick="searchEntryRecords('douyin')" class="btn btn-primary" style="padding: 8px 15px; font-size: 13px; width: 100%;">
                                🔍 查询
                            </button>
                        </div>
                        <div>
                            <button onclick="resetEntryFilters()" class="btn btn-secondary" style="padding: 8px 15px; font-size: 13px; width: 100%;">
                                🔄 重置
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 数据表格 -->
                <div style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                        <thead style="position: sticky; top: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; z-index: 10;">
                            <tr>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">ID</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">直播间ID</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">用户UID</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">用户昵称</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">抖音号</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">是否已使用</th>
                                <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">进入时间</th>
                                <th style="padding: 10px; text-align: center; border-bottom: 2px solid rgba(255,255,255,0.2);">操作</th>
                            </tr>
                        </thead>
                        <tbody id="entry-table-body" style="background: white;">
                            <tr>
                                <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                                    点击“查询”按钮加载入场记录
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div id="entry-pagination" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                    <button onclick="changeEntryPage(-1)" id="entry-prev-btn" disabled style="padding: 6px 12px; border: 1px solid #667eea; background: white; color: #667eea; border-radius: 4px; cursor: pointer; font-size: 12px;">上一页</button>
                    <span id="entry-page-info" style="font-size: 12px; color: #666;">第 1 / 1 页</span>
                    <button onclick="changeEntryPage(1)" id="entry-next-btn" disabled style="padding: 6px 12px; border: 1px solid #667eea; background: white; color: #667eea; border-radius: 4px; cursor: pointer; font-size: 12px;">下一页</button>
                </div>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="log-section">
            <h2>📋 操作日志</h2>
            <div class="log-container" id="log-container">
                <div class="log-entry log-info">系统已就绪，等待操作...</div>
            </div>
        </div>
    </div>

    <!-- 通用确认对话框 -->
    <div id="confirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(4px);" onclick="if(event.target === this) closeConfirmModal()">
        <div style="background: white; border-radius: 16px; padding: 0; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: modalSlideIn 0.3s ease-out; overflow: hidden;">
            <!-- 头部 -->
            <div id="confirmModalHeader" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px 25px; color: white;">
                <h3 id="confirmModalTitle" style="margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px;">
                    确认操作
                </h3>
            </div>
            
            <!-- 内容区 -->
            <div style="padding: 25px 30px;">
                <div id="confirmModalWarning" style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px 15px; margin-bottom: 20px; border-radius: 4px; display: none;">
                    <p id="confirmModalWarningText" style="margin: 0; font-size: 14px; color: #856404; line-height: 1.5;">
                    </p>
                </div>
                
                <p id="confirmModalMessage" style="margin: 0; font-size: 15px; color: #333; line-height: 1.6;">
                </p>
                
                <div id="confirmModalExtra" style="margin-top: 15px; display: none;">
                </div>
            </div>
            
            <!-- 底部按钮 -->
            <div style="padding: 18px 25px; background: #f8f9fa; display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="closeConfirmModal()" class="btn btn-secondary" style="flex: 1; max-width: 100px;">
                    取消
                </button>
                <button id="confirmModalBtn" class="btn btn-primary" style="flex: 1; max-width: 100px;">
                    确定
                </button>
            </div>
        </div>
    </div>

    <!-- 动画样式 -->
    <style>
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>

    <script th:src="@{/js/admin.js}"></script>
    <script>
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查平台是否启用
            const enabled = await requirePlatformEnabled('douyin');
            if (!enabled) return;
            
            addLog('抖音配置页面加载完成', 'info');
            await loadPlatformConfig('douyin');
            
            // 加载批量连接状态
            await loadBatchStatus('douyin');
            
            // 自动查询当前平台的入场记录（默认查询）
            setTimeout(() => searchEntryRecords('douyin'), 500);
            
            // 定时刷新状态
            setInterval(() => updateClientStatus('douyin'), 10000);
            // 定时刷新批量连接状态（每15秒）
            setInterval(() => loadBatchStatus('douyin'), 15000);
        });

        // 批量连接房间
        async function batchConnectRooms(platform) {
            const textarea = document.getElementById(`batch-roomIds-${platform}`);
            const roomIdsText = textarea.value.trim();
            
            if (!roomIdsText) {
                showToast('请输入房间ID列表', 'error');
                return;
            }

            // 解析房间ID（每行一个）
            const roomIds = roomIdsText.split('\n')
                .map(line => line.trim())
                .filter(line => line && !isNaN(Number(line)))
                .map(id => Number(id));

            if (roomIds.length === 0) {
                showToast('没有有效的房间ID', 'error');
                return;
            }

            showConfirm({
                title: '批量连接',
                message: `确定要批量连接 ${roomIds.length} 个房间吗？`,
                type: 'info',
                icon: '',
                onConfirm: async () => {
                    await executeBatchConnect(platform, roomIds);
                }
            });
        }

        // 执行批量连接（带loading）
        async function executeBatchConnect(platform, roomIds) {
            // 显示loading
            showBatchConnectLoading();
            
            try {
                addLog(`开始批量连接房间: count=${roomIds.length}`, 'info');
                
                const response = await fetch(`/client/multiply/batch-connect?platform=${platform}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roomIds)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast(result.message, 'success');
                    addLog(result.message, 'success');
                    
                    if (result.failCount > 0) {
                        addLog(`失败的房间: ${result.failedRooms.join(', ')}`, 'warning');
                    }
                    
                    // 刷新批量连接状态
                    setTimeout(() => loadBatchStatus(platform), 1000);
                } else {
                    showToast('批量连接失败', 'error');
                    addLog('批量连接失败', 'error');
                }
            } catch (error) {
                showToast('批量连接失败: ' + error.message, 'error');
                addLog('批量连接失败: ' + error.message, 'error');
            } finally {
                // 隐藏loading
                hideBatchConnectLoading();
            }
        }

        // 显示批量连接loading
        function showBatchConnectLoading() {
            const card = document.querySelector('.platform-card:last-child');
            if (!card) return;
            
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'batchConnectLoading';
            loadingDiv.style.cssText = `
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(255, 255, 255, 0.9);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 100;
                border-radius: 15px;
            `;
            loadingDiv.innerHTML = `
                <div class="loading"></div>
                <p style="margin-top: 15px; color: #667eea; font-weight: 500;">正在批量连接房间...</p>
            `;
            
            card.style.position = 'relative';
            card.appendChild(loadingDiv);
        }

        // 隐藏批量连接loading
        function hideBatchConnectLoading() {
            const loadingDiv = document.getElementById('batchConnectLoading');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // ========== 批量连接状态管理 ==========

        /**
         * 加载批量连接状态
         */
        async function loadBatchStatus(platform) {
            try {
                addLog(`正在加载${getPlatformName(platform)}批量连接状态...`, 'info');
                
                const response = await fetch(`/client/multiply/batch-status?platform=${platform}`);
                const result = await response.json();
                
                if (result.success) {
                    renderBatchStatus(result.statusList, platform);
                    addLog(`已加载 ${result.count} 个房间的状态`, 'success');
                } else {
                    showToast('加载状态失败', 'error');
                    addLog('加载批量连接状态失败', 'error');
                }
            } catch (error) {
                showToast('加载状态失败: ' + error.message, 'error');
                addLog('加载批量连接状态失败: ' + error.message, 'error');
            }
        }

        /**
         * 渲染批量连接状态
         */
        function renderBatchStatus(statusList, platform) {
            const container = document.getElementById('batch-status-container');
            const countElement = document.getElementById('batch-status-count');
            
            // 更新计数
            countElement.textContent = `共 ${statusList.length} 个房间`;
            
            if (statusList.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <p>暂无批量连接的房间</p>
                        <p style="font-size: 0.85em; margin-top: 10px;">点击“批量连接”按钮开始连接房间</p>
                    </div>
                `;
                return;
            }
            
            // 生成状态列表HTML
            let html = '<div style="display: grid; gap: 10px;">';
            
            statusList.forEach(status => {
                const roomId = status.roomId;
                const statusText = status.statusText || '未知';
                const isConnected = status.connected;
                const statusCode = status.statusCode;
                
                // 根据状态选择颜色和图标
                let bgColor, textColor, icon;
                if (isConnected) {
                    bgColor = '#d4edda';
                    textColor = '#155724';
                    icon = '✅';
                } else if (statusCode === 100 || statusCode === 101) {
                    bgColor = '#fff3cd';
                    textColor = '#856404';
                    icon = '⏳';
                } else if (statusCode === 401) {
                    bgColor = '#f8d7da';
                    textColor = '#721c24';
                    icon = '❌';
                } else {
                    bgColor = '#e2e3e5';
                    textColor = '#383d41';
                    icon = '⚪';
                }
                
                html += `
                    <div style="background: ${bgColor}; color: ${textColor}; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid ${isConnected ? '#28a745' : '#dc3545'};">
                        <div style="flex: 1;">
                            <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">
                                ${icon} 房间ID: ${roomId}
                            </div>
                            <div style="font-size: 12px; opacity: 0.9;">
                                状态: ${statusText}
                            </div>
                        </div>
                        <button onclick="disconnectRoom(${roomId}, '${platform}')" 
                                style="background: rgba(255,255,255,0.8); border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #dc3545; font-weight: 500; transition: all 0.3s;"
                                onmouseover="this.style.background='rgba(255,255,255,1)'"
                                onmouseout="this.style.background='rgba(255,255,255,0.8)'">
                            断开
                        </button>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        /**
         * 断开单个房间连接
         */
        async function disconnectRoom(roomId, platform) {
            showConfirm({
                title: '断开连接',
                message: `确定要断开房间 ${roomId} 的连接吗？`,
                type: 'warning',
                icon: '',
                onConfirm: async () => {
                    try {
                        addLog(`正在断开房间 ${roomId}...`, 'info');
                        
                        const response = await fetch(`/client/multiply/batch-disconnect?roomId=${roomId}&platform=${platform}`, {
                            method: 'POST'
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            showToast(result.message, 'success');
                            addLog(result.message, 'success');
                            // 重新加载状态
                            await loadBatchStatus(platform);
                        } else {
                            showToast(result.message, 'error');
                            addLog(result.message, 'error');
                        }
                    } catch (error) {
                        showToast('断开连接失败: ' + error.message, 'error');
                        addLog('断开连接失败: ' + error.message, 'error');
                    }
                }
            });
        }

        /**
         * 断开所有房间连接
         */
        async function disconnectAllRooms(platform) {
            showConfirm({
                title: '断开所有连接',
                message: '确定要断开所有批量连接的房间吗？',
                warning: '此操作将断开所有通过批量连接功能连接的房间。',
                type: 'danger',
                icon: '',
                onConfirm: async () => {
                    try {
                        addLog('正在断开所有房间...', 'info');
                        
                        const response = await fetch(`/client/multiply/batch-disconnect-all?platform=${platform}`, {
                            method: 'POST'
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            showToast(result.message, 'success');
                            addLog(result.message, 'success');
                            // 清空状态显示
                            renderBatchStatus([], platform);
                        } else {
                            showToast(result.message, 'error');
                            addLog(result.message, 'error');
                        }
                    } catch (error) {
                        showToast('断开所有连接失败: ' + error.message, 'error');
                        addLog('断开所有连接失败: ' + error.message, 'error');
                    }
                }
            });
        }

        // ========== 入场记录查询功能 ==========

        // 入场记录分页信息
        let entryCurrentPage = 1;
        let entryPageSize = 20;
        let entryTotalPages = 1;
        let entryTotalCount = 0;
        let entryPlatform = 'douyin';

        /**
         * 搜索入场记录
         */
        async function searchEntryRecords(platform) {
            entryPlatform = platform;
            entryCurrentPage = 1;
            
            try {
                addLog(`正在查询${getPlatformName(platform)}入场记录...`, 'info');
                
                const roomId = document.getElementById('entry-filter-roomId').value.trim();
                const username = document.getElementById('entry-filter-username').value.trim();
                const startTime = document.getElementById('entry-filter-startTime').value;
                const endTime = document.getElementById('entry-filter-endTime').value;
                
                // 构建查询参数
                const params = new URLSearchParams();
                params.append('platform', platform);
                if (roomId) params.append('roomId', roomId);
                if (username) params.append('username', username);
                if (startTime) params.append('startTime', startTime);
                if (endTime) params.append('endTime', endTime);
                params.append('pageNum', entryCurrentPage);
                params.append('pageSize', entryPageSize);
                
                const response = await fetch(`/api/live-entry/query?${params.toString()}`);
                const result = await response.json();
                
                if (result.success) {
                    renderEntryTable(result.data, platform);
                    updateEntryPagination(result.total, result.pageNum, result.totalPages);
                    addLog(`查询成功，共 ${result.total} 条记录`, 'success');
                } else {
                    showToast('查询失败', 'error');
                    addLog('查询入场记录失败', 'error');
                }
            } catch (error) {
                showToast('查询失败: ' + error.message, 'error');
                addLog('查询入场记录失败: ' + error.message, 'error');
            }
        }

        /**
         * 渲染入场记录表格
         */
        function renderEntryTable(data, platform) {
            const tbody = document.getElementById('entry-table-body');
            const totalCountElement = document.getElementById('entry-total-count');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            暂无入场记录
                        </td>
                    </tr>
                `;
                totalCountElement.textContent = '总记录数: 0';
                return;
            }
            
            let html = '';
            data.forEach(entry => {
                const isUsed = entry.used || false;
                const usedBadge = isUsed ? 
                    '<span style="background: #d4edda; color: #155724; padding: 3px 8px; border-radius: 10px; font-size: 11px;">✓ 已使用</span>' :
                    '<span style="background: #fff3cd; color: #856404; padding: 3px 8px; border-radius: 10px; font-size: 11px;">○ 未使用</span>';
                
                const enterTime = entry.enterTime ? formatDateTime(entry.enterTime) : '-';
                
                html += `
                    <tr style="border-bottom: 1px solid #e0e0e0; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f5f5f5'" onmouseout="this.style.backgroundColor='white'">
                        <td style="padding: 10px;">${entry.id}</td>
                        <td style="padding: 10px;">${entry.roomId || '-'}</td>
                        <td style="padding: 10px;">${entry.uid || '-'}</td>
                        <td style="padding: 10px;">${entry.username || '-'}</td>
                        <td style="padding: 10px;">${entry.displayId || '-'}</td>
                        <td style="padding: 10px;">${usedBadge}</td>
                        <td style="padding: 10px;">${enterTime}</td>
                        <td style="padding: 10px; text-align: center;">
                            <button onclick="deleteEntryRecord(${entry.id})" 
                                    style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;"
                                    onmouseover="this.style.background='#c82333'"
                                    onmouseout="this.style.background='#dc3545'">
                                ️ 删除
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            totalCountElement.textContent = `总记录数: ${entryTotalCount}`;
        }

        /**
         * 更新分页控件
         */
        function updateEntryPagination(total, pageNum, totalPages) {
            entryTotalCount = total;
            entryCurrentPage = pageNum;
            entryTotalPages = totalPages;
            
            const pageInfo = document.getElementById('entry-page-info');
            const prevBtn = document.getElementById('entry-prev-btn');
            const nextBtn = document.getElementById('entry-next-btn');
            
            pageInfo.textContent = `第 ${pageNum} / ${totalPages} 页`;
            prevBtn.disabled = pageNum <= 1;
            nextBtn.disabled = pageNum >= totalPages;
        }

        /**
         * 切换页码
         */
        async function changeEntryPage(direction) {
            const newPage = entryCurrentPage + direction;
            if (newPage < 1 || newPage > entryTotalPages) return;
            
            entryCurrentPage = newPage;
            
            // 重新查询当前页
            const roomId = document.getElementById('entry-filter-roomId').value.trim();
            const username = document.getElementById('entry-filter-username').value.trim();
            const startTime = document.getElementById('entry-filter-startTime').value;
            const endTime = document.getElementById('entry-filter-endTime').value;
            
            const params = new URLSearchParams();
            params.append('platform', entryPlatform);
            if (roomId) params.append('roomId', roomId);
            if (username) params.append('username', username);
            if (startTime) params.append('startTime', startTime);
            if (endTime) params.append('endTime', endTime);
            params.append('pageNum', entryCurrentPage);
            params.append('pageSize', entryPageSize);
            
            try {
                const response = await fetch(`/api/live-entry/query?${params.toString()}`);
                const result = await response.json();
                
                if (result.success) {
                    renderEntryTable(result.data, entryPlatform);
                    updateEntryPagination(result.total, result.pageNum, result.totalPages);
                }
            } catch (error) {
                showToast('翻页失败: ' + error.message, 'error');
            }
        }

        /**
         * 重置筛选条件
         */
        function resetEntryFilters() {
            document.getElementById('entry-filter-roomId').value = '';
            document.getElementById('entry-filter-username').value = '';
            document.getElementById('entry-filter-startTime').value = '';
            document.getElementById('entry-filter-endTime').value = '';
            
            showToast('筛选条件已重置', 'success');
        }

        /**
         * 删除单条入场记录
         */
        async function deleteEntryRecord(id) {
            showConfirm({
                title: '删除记录',
                message: `确定要删除ID为 ${id} 的入场记录吗？`,
                type: 'danger',
                icon: '',
                onConfirm: async () => {
                    try {
                        addLog(`正在删除记录 ${id}...`, 'info');
                        
                        const response = await fetch(`/api/live-entry/${id}`, {
                            method: 'DELETE'
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            showToast('删除成功', 'success');
                            addLog('删除成功', 'success');
                            // 重新查询当前页
                            searchEntryRecords(entryPlatform);
                        } else {
                            showToast('删除失败', 'error');
                            addLog('删除失败', 'error');
                        }
                    } catch (error) {
                        showToast('删除失败: ' + error.message, 'error');
                        addLog('删除失败: ' + error.message, 'error');
                    }
                }
            });
        }

        /**
         * 格式化日期时间
         */
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            
            // 处理ISO格式的时间字符串
            const date = new Date(dateTimeStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            const second = String(date.getSeconds()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
        }

        // ========== 通用确认对话框功能 ==========
        
        let confirmCallback = null;

        /**
         * 显示确认对话框
         */
        function showConfirm(options) {
            const modal = document.getElementById('confirmModal');
            const header = document.getElementById('confirmModalHeader');
            const title = document.getElementById('confirmModalTitle');
            const message = document.getElementById('confirmModalMessage');
            const warning = document.getElementById('confirmModalWarning');
            const warningText = document.getElementById('confirmModalWarningText');
            const extra = document.getElementById('confirmModalExtra');
            const btn = document.getElementById('confirmModalBtn');

            // 设置标题
            title.innerHTML = options.icon ? `${options.icon} ${options.title}` : options.title;

            // 设置头部颜色
            if (options.type === 'danger') {
                header.style.background = 'linear-gradient(135deg, #eb3349 0%, #f45c43 100%)';
                btn.className = 'btn btn-danger';
            } else if (options.type === 'warning') {
                header.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
                btn.className = 'btn btn-warning';
            } else {
                header.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                btn.className = 'btn btn-primary';
            }

            // 设置消息
            message.textContent = options.message;

            // 设置警告信息
            if (options.warning) {
                warning.style.display = 'block';
                warningText.textContent = options.warning;
            } else {
                warning.style.display = 'none';
            }

            // 设置额外内容
            if (options.extraHtml) {
                extra.style.display = 'block';
                extra.innerHTML = options.extraHtml;
            } else {
                extra.style.display = 'none';
            }

            // 设置按钮文本
            btn.textContent = options.confirmText || '确定';

            // 保存回调函数
            confirmCallback = options.onConfirm;

            // 绑定确认按钮事件
            btn.onclick = function() {
                if (confirmCallback) {
                    confirmCallback();
                }
                closeConfirmModal();
            };

            // 显示模态框
            modal.style.display = 'flex';

            // 自动聚焦到确认按钮
            setTimeout(() => {
                btn.focus();
            }, 100);
        }

        // 关闭确认对话框
        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.style.display = 'none';
            confirmCallback = null;
        }

        // 按ESC键关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeConfirmModal();
            }
        });
    </script>
</body>
</html>

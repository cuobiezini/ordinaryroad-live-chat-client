<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗鱼配置 - 直播弹幕客户端管理系统</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 斗鱼直播间配置</h1>
            <p>Douyu Live Chat Client Configuration</p>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="/" class="nav-link">📊 总览</a>
                <a href="/bilibili" class="nav-link">🟣 B站</a>
                <a href="/douyu" class="nav-link active">🔴 斗鱼</a>
                <a href="/kuaishou" class="nav-link">🟠 快手</a>
                <a href="/douyin" class="nav-link">⚫ 抖音</a>
            </div>
        </div>

        <!-- 平台配置卡片 -->
        <div class="dashboard">
            <div class="platform-card" style="cursor: default; position: relative;" id="config-card-douyu">
                <div class="platform-header">
                    <div class="platform-name">🔴 斗鱼 (Douyu)</div>
                    <span class="status-badge status-disconnected" id="status-douyu">未连接</span>
                </div>
                
                <div class="form-group">
                    <label for="roomId-douyu">直播间ID</label>
                    <input type="text" id="roomId-douyu" placeholder="输入斗鱼直播间ID，例如: 74751">
                </div>
                
                <div class="form-group">
                    <label for="cookie-douyu">Cookie（可选）</label>
                    <input type="password" id="cookie-douyu" placeholder="输入浏览器Cookie，用于身份验证">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="autoReconnect-douyu" checked>
                        自动重连
                    </label>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-success" onclick="saveConfig('douyu')" id="btn-save-douyu">
                        💾 保存配置
                    </button>
                    <button class="btn btn-primary" onclick="connectClient('douyu')" id="btn-connect-douyu">
                        🔌 连接
                    </button>
                    <button class="btn btn-danger" onclick="disconnectClient('douyu')" id="btn-disconnect-douyu" disabled>
                        ⛔ 断开
                    </button>
                    <button class="btn btn-warning" onclick="reconnectClient('douyu')" id="btn-reconnect-douyu">
                        🔄 重连
                    </button>
                </div>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="log-section">
            <h2>📋 操作日志</h2>
            <div class="log-container" id="log-container">
                <div class="log-entry log-info">系统已就绪，等待操作...</div>
            </div>
        </div>

        <!-- 入场记录查询 -->
        <div class="log-section">
            <h2>📥 入场记录查询</h2>
            <div style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <!-- 统计信息 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span id="entry-total-count-douyu" style="color: #666; font-size: 14px;">总记录数: 0</span>
                </div>
            
            <!-- 筛选条件 -->
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                    <div>
                        <label style="font-size: 0.9em; color: #666; display: block; margin-bottom: 5px;">直播间ID</label>
                        <input type="text" id="entry-filter-roomId-douyu" placeholder="输入直播间ID" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div>
                        <label style="font-size: 0.9em; color: #666; display: block; margin-bottom: 5px;">开始时间</label>
                        <input type="datetime-local" id="entry-filter-startTime-douyu" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div>
                        <label style="font-size: 0.9em; color: #666; display: block; margin-bottom: 5px;">结束时间</label>
                        <input type="datetime-local" id="entry-filter-endTime-douyu" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div style="display: flex; align-items: center;">
                        <button onclick="searchEntryRecords('douyu')" style="padding: 8px 20px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">🔍 查询</button>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <button onclick="resetEntryFilters('douyu')" style="padding: 8px 20px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">🔄 重置</button>
                    </div>
                </div>
            </div>
            
            <!-- 数据表格 -->
            <div style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>直播间ID</th>
                            <th>用户昵称</th>
                            <th>抖音号</th>
                            <th>是否已使用</th>
                            <th>进入时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="entry-table-body-douyu">
                        <!-- 数据动态生成 -->
                    </tbody>
                </table>
            </div>
            
            <!-- 分页 -->
            <div id="entry-pagination-douyu" style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; padding: 10px;">
                <button onclick="changeEntryPage('douyu', -1)" style="padding: 6px 15px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">上一页</button>
                <span id="entry-page-info-douyu" style="color: #666;">第 1 / 1 页</span>
                <button onclick="changeEntryPage('douyu', 1)" style="padding: 6px 15px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">下一页</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin.js}"></script>
    <script>
        // 入场记录分页信息（按平台存储）
        const entryPaginationData = {};

        /**
         * 搜索入场记录
         */
        async function searchEntryRecords(platform) {
            // 初始化该平台的数据
            if (!entryPaginationData[platform]) {
                entryPaginationData[platform] = {
                    currentPage: 1,
                    pageSize: 20,
                    totalPages: 1,
                    totalCount: 0
                };
            }
            
            const pagination = entryPaginationData[platform];
            pagination.currentPage = 1;
            
            try {
                // 显示表格loading
                const tbody = document.getElementById(`entry-table-body-${platform}`);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            <div class="loading"></div>
                            <p style="margin-top: 15px;">加载中...</p>
                        </td>
                    </tr>
                `;
                
                const roomId = document.getElementById(`entry-filter-roomId-${platform}`).value.trim();
                const startTime = document.getElementById(`entry-filter-startTime-${platform}`).value;
                const endTime = document.getElementById(`entry-filter-endTime-${platform}`).value;
                
                // 构造POST请求体
                const requestBody = {
                    platform: platform,
                    pageNum: pagination.currentPage,
                    pageSize: pagination.pageSize
                };
                
                if (roomId) requestBody.roomId = roomId;
                if (startTime) requestBody.startTime = startTime;
                if (endTime) requestBody.endTime = endTime;
                
                const response = await fetch('/api/live-entry/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const result = await response.json();
                
                if (result.success) {
                    renderEntryTable(result.data, platform);
                    updateEntryPagination(result.total, result.pageNum, result.totalPages, platform);
                } else {
                    showToast('查询失败: ' + (result.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('查询入场记录失败:', error);
                showToast('查询失败: ' + error.message, 'error');
            }
        }

        /**
         * 渲染入场记录表格
         */
        function renderEntryTable(data, platform) {
            const tbody = document.getElementById(`entry-table-body-${platform}`);
            const totalCountElement = document.getElementById(`entry-total-count-${platform}`);
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px; color: #999;">暂无入场记录</td></tr>';
                totalCountElement.textContent = '总记录数: 0';
                return;
            }
            
            let html = '';
            data.forEach(entry => {
                const isUsed = entry.used || false;
                const usedBadge = isUsed ? 
                    '<span style="background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 4px; font-size: 0.85em;">✓ 已使用</span>' :
                    '<span style="background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 4px; font-size: 0.85em;">○ 未使用</span>';
                
                html += `
                    <tr>
                        <td>${entry.id}</td>
                        <td>${entry.roomId || '-'}</td>
                        <td>${entry.username || '-'}</td>
                        <td>${entry.displayId || '-'}</td>
                        <td>${usedBadge}</td>
                        <td>${formatDateTime(entry.enterTime)}</td>
                        <td>
                            <button onclick="deleteEntryRecord(${entry.id}, '${platform}')" style="padding: 4px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em;">删除</button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            totalCountElement.textContent = `总记录数: ${entryPaginationData[platform].totalCount}`;
        }

        /**
         * 更新分页信息
         */
        function updateEntryPagination(total, pageNum, totalPages, platform) {
            const pagination = entryPaginationData[platform];
            pagination.totalCount = total;
            pagination.currentPage = pageNum;
            pagination.totalPages = totalPages;
            
            const pageInfoElement = document.getElementById(`entry-page-info-${platform}`);
            if (pageInfoElement) {
                pageInfoElement.textContent = `第 ${pageNum} / ${totalPages} 页`;
            }
        }

        /**
         * 切换页码
         */
        async function changeEntryPage(platform, delta) {
            const pagination = entryPaginationData[platform];
            const newPage = pagination.currentPage + delta;
            
            if (newPage < 1 || newPage > pagination.totalPages) {
                return;
            }
            
            try {
                // 显示表格loading
                const tbody = document.getElementById(`entry-table-body-${platform}`);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            <div class="loading"></div>
                            <p style="margin-top: 15px;">加载中...</p>
                        </td>
                    </tr>
                `;
                
                const roomId = document.getElementById(`entry-filter-roomId-${platform}`).value.trim();
                const startTime = document.getElementById(`entry-filter-startTime-${platform}`).value;
                const endTime = document.getElementById(`entry-filter-endTime-${platform}`).value;
                
                // 构造POST请求体
                const requestBody = {
                    platform: platform,
                    pageNum: newPage,
                    pageSize: pagination.pageSize
                };
                
                if (roomId) requestBody.roomId = roomId;
                if (startTime) requestBody.startTime = startTime;
                if (endTime) requestBody.endTime = endTime;
                
                const response = await fetch('/api/live-entry/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const result = await response.json();
                
                if (result.success) {
                    renderEntryTable(result.data, platform);
                    updateEntryPagination(result.total, result.pageNum, result.totalPages, platform);
                }
            } catch (error) {
                console.error('切换页面失败:', error);
                showToast('切换页面失败: ' + error.message, 'error');
            }
        }

        /**
         * 重置筛选条件
         */
        function resetEntryFilters(platform) {
            document.getElementById(`entry-filter-roomId-${platform}`).value = '';
            document.getElementById(`entry-filter-startTime-${platform}`).value = '';
            document.getElementById(`entry-filter-endTime-${platform}`).value = '';
            
            searchEntryRecords(platform);
        }

        /**
         * 删除入场记录
         */
        async function deleteEntryRecord(recordId, platform) {
            if (!confirm('确定要删除这条入场记录吗？')) {
                return;
            }
            
            try {
                // 显示表格loading
                const tbody = document.getElementById(`entry-table-body-${platform}`);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            <div class="loading"></div>
                            <p style="margin-top: 15px;">删除中...</p>
                        </td>
                    </tr>
                `;
                
                const response = await fetch(`/api/live-entry/delete/${recordId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('删除成功', 'success');
                    // 重新查询当前页
                    searchEntryRecords(platform);
                } else {
                    showToast('删除失败: ' + (result.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('删除入场记录失败:', error);
                showToast('删除失败: ' + error.message, 'error');
            }
        }

        /**
         * 格式化日期时间
         */
        function formatDateTime(dateTimeString) {
            if (!dateTimeString) return '-';
            
            try {
                const date = new Date(dateTimeString);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            } catch (error) {
                return dateTimeString;
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查平台是否启用
            const enabled = await requirePlatformEnabled('douyu');
            if (!enabled) return;
            
            addLog('斗鱼配置页面加载完成', 'info');
            
            // 显示loading
            showConfigLoading('douyu');
            
            try {
                await loadPlatformConfig('douyu');
            } finally {
                hideConfigLoading('douyu');
            }
            
            // 定时刷新状态
            setInterval(() => updateClientStatus('douyu'), 10000);
            
            // 自动查询当前平台的入场记录（默认查询）
            setTimeout(() => searchEntryRecords('douyu'), 500);
        });

        // 显示配置加载loading
        function showConfigLoading(platform) {
            const card = document.getElementById(`config-card-${platform}`);
            if (!card) return;
            
            const loadingDiv = document.createElement('div');
            loadingDiv.id = `config-loading-${platform}`;
            loadingDiv.style.cssText = `
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(255, 255, 255, 0.9);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 100;
                border-radius: 15px;
            `;
            loadingDiv.innerHTML = `
                <div class="loading"></div>
                <p style="margin-top: 15px; color: #667eea; font-weight: 500;">正在加载配置...</p>
            `;
            
            card.appendChild(loadingDiv);
        }

        // 隐藏配置加载loading
        function hideConfigLoading(platform) {
            const loadingDiv = document.getElementById(`config-loading-${platform}`);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }
    </script>
</body>
</html>

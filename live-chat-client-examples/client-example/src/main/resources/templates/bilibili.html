<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站配置 - 直播弹幕客户端管理系统</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🟣 B站直播间配置</h1>
            <p>Bilibili Live Chat Client Configuration</p>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="/" class="nav-link">📊 总览</a>
                <a href="/entry-history" class="nav-link">📥 入场记录</a>
                <a href="/bilibili" class="nav-link active">🟣 B站</a>
                <a href="/douyu" class="nav-link">🔴 斗鱼</a>
                <a href="/kuaishou" class="nav-link">🟠 快手</a>
                <a href="/douyin" class="nav-link">⚫ 抖音</a>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="user-info" style="color: #666; font-size: 14px;"></span>
                <a href="/logout" class="btn btn-danger" style="padding: 8px 20px; text-decoration: none; display: inline-block;">🚪 退出登录</a>
            </div>
        </div>

        <!-- 平台配置卡片 -->
        <div class="dashboard">
            <div class="platform-card" style="cursor: default;">
                <div class="platform-header">
                    <div class="platform-name">🟣 B站 (Bilibili)</div>
                    <span class="status-badge status-disconnected" id="status-bilibili">未连接</span>
                </div>
                
                <div class="form-group">
                    <label for="roomId-bilibili">直播间ID</label>
                    <input type="text" id="roomId-bilibili" placeholder="输入B站直播间ID，例如: 7777">
                </div>
                
                <div class="form-group">
                    <label for="cookie-bilibili">Cookie（可选）</label>
                    <input type="password" id="cookie-bilibili" placeholder="输入浏览器Cookie，用于身份验证">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="autoReconnect-bilibili" checked>
                        自动重连
                    </label>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-success" onclick="saveConfig('bilibili')" id="btn-save-bilibili">
                        💾 保存配置
                    </button>
                    <button class="btn btn-primary" onclick="connectClient('bilibili')" id="btn-connect-bilibili">
                        🔌 连接
                    </button>
                    <button class="btn btn-danger" onclick="disconnectClient('bilibili')" id="btn-disconnect-bilibili" disabled>
                        ⛔ 断开
                    </button>
                    <button class="btn btn-warning" onclick="reconnectClient('bilibili')" id="btn-reconnect-bilibili">
                        🔄 重连
                    </button>
                </div>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="log-section">
            <h2>📋 操作日志</h2>
            <div class="log-container" id="log-container">
                <div class="log-entry log-info">系统已就绪，等待操作...</div>
            </div>
        </div>

        <!-- 入场记录查询 -->
        <div class="log-section">
            <h2>📥 入场记录查询</h2>
            <div style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <!-- 统计信息 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span id="entry-total-count-bilibili" style="color: #666; font-size: 14px;">总记录数: 0</span>
                </div>
            
            <!-- 筛选条件 -->
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end;">
                    <div>
                        <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">直播间ID</label>
                        <input type="text" id="entry-filter-roomId-bilibili" placeholder="输入直播间ID" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">开始时间</label>
                        <input type="datetime-local" id="entry-filter-startTime-bilibili" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">结束时间</label>
                        <input type="datetime-local" id="entry-filter-endTime-bilibili" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
                    </div>
                    <div>
                        <button onclick="searchEntryRecords('bilibili')" class="btn btn-primary" style="padding: 8px 15px; font-size: 13px; width: 100%;">
                            🔍 查询
                        </button>
                    </div>
                    <div>
                        <button onclick="resetEntryFilters('bilibili')" class="btn btn-secondary" style="padding: 8px 15px; font-size: 13px; width: 100%;">
                            🔄 重置
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 数据表格 -->
            <div style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <thead style="position: sticky; top: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; z-index: 10;">
                        <tr>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">ID</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">直播间ID</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">用户昵称</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">抖音号</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">是否已使用</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 2px solid rgba(255,255,255,0.2);">进入时间</th>
                            <th style="padding: 10px; text-align: center; border-bottom: 2px solid rgba(255,255,255,0.2);">操作</th>
                        </tr>
                    </thead>
                    <tbody id="entry-table-body-bilibili" style="background: white;">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                                点击“查询”按钮加载入场记录
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 分页 -->
            <div id="entry-pagination-bilibili" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                <button onclick="changeEntryPage(-1, 'bilibili')" id="entry-prev-btn-bilibili" disabled style="padding: 6px 12px; border: 1px solid #667eea; background: white; color: #667eea; border-radius: 4px; cursor: pointer; font-size: 12px;">上一页</button>
                <span id="entry-page-info-bilibili" style="font-size: 12px; color: #666;">第 1 / 1 页</span>
                <button onclick="changeEntryPage(1, 'bilibili')" id="entry-next-btn-bilibili" disabled style="padding: 6px 12px; border: 1px solid #667eea; background: white; color: #667eea; border-radius: 4px; cursor: pointer; font-size: 12px;">下一页</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查平台是否启用
            const enabled = await requirePlatformEnabled('bilibili');
            if (!enabled) return;
            
            addLog('B站配置页面加载完成', 'info');
            
            // 显示loading
            showConfigLoading('bilibili');
            
            try {
                await loadPlatformConfig('bilibili');
            } finally {
                hideConfigLoading('bilibili');
            }
            
            // 定时刷新状态
            setInterval(() => updateClientStatus('bilibili'), 10000);
        });

        // 显示配置加载loading
        function showConfigLoading(platform) {
            const card = document.getElementById(`config-card-${platform}`);
            if (!card) return;
            
            const loadingDiv = document.createElement('div');
            loadingDiv.id = `config-loading-${platform}`;
            loadingDiv.style.cssText = `
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(255, 255, 255, 0.9);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 100;
                border-radius: 15px;
            `;
            loadingDiv.innerHTML = `
                <div class="loading"></div>
                <p style="margin-top: 15px; color: #667eea; font-weight: 500;">正在加载配置...</p>
            `;
            
            card.appendChild(loadingDiv);
        }

        // 隐藏配置加载loading
        function hideConfigLoading(platform) {
            const loadingDiv = document.getElementById(`config-loading-${platform}`);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // ========== 入场记录查询功能 ==========

        // 入场记录分页信息（按平台存储）
        const entryPaginationData = {};

        /**
         * 搜索入场记录
         */
        async function searchEntryRecords(platform) {
            // 初始化该平台的数据
            if (!entryPaginationData[platform]) {
                entryPaginationData[platform] = {
                    currentPage: 1,
                    pageSize: 20,
                    totalPages: 1,
                    totalCount: 0
                };
            }
            
            const pagination = entryPaginationData[platform];
            pagination.currentPage = 1;
            
            try {
                addLog(`正在查询${getPlatformName(platform)}入场记录...`, 'info');
                
                // 显示表格loading
                const tbody = document.getElementById(`entry-table-body-${platform}`);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            <div class="loading"></div>
                            <p style="margin-top: 15px;">加载中...</p>
                        </td>
                    </tr>
                `;
                
                const roomId = document.getElementById(`entry-filter-roomId-${platform}`).value.trim();
                const startTime = document.getElementById(`entry-filter-startTime-${platform}`).value;
                const endTime = document.getElementById(`entry-filter-endTime-${platform}`).value;
                
                // 构造POST请求体
                const requestBody = {
                    platform: platform,
                    pageNum: pagination.currentPage,
                    pageSize: pagination.pageSize
                };
                
                if (roomId) requestBody.roomId = roomId;
                if (startTime) requestBody.startTime = startTime;
                if (endTime) requestBody.endTime = endTime;
                
                const response = await fetch('/api/live-entry/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const result = await response.json();
                
                if (result.success) {
                    renderEntryTable(result.data, platform);
                    updateEntryPagination(result.total, result.pageNum, result.totalPages, platform);
                    addLog(`查询成功，共 ${result.total} 条记录`, 'success');
                } else {
                    showToast('查询失败', 'error');
                    addLog('查询入场记录失败', 'error');
                }
            } catch (error) {
                showToast('查询失败: ' + error.message, 'error');
                addLog('查询入场记录失败: ' + error.message, 'error');
            }
        }

        /**
         * 渲染入场记录表格
         */
        function renderEntryTable(data, platform) {
            const tbody = document.getElementById(`entry-table-body-${platform}`);
            const totalCountElement = document.getElementById(`entry-total-count-${platform}`);
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                            暂无入场记录
                        </td>
                    </tr>
                `;
                totalCountElement.textContent = '总记录数: 0';
                return;
            }
            
            let html = '';
            data.forEach(entry => {
                const isUsed = entry.used || false;
                const usedBadge = isUsed ? 
                    '<span style="background: #d4edda; color: #155724; padding: 3px 8px; border-radius: 10px; font-size: 11px;">✓ 已使用</span>' :
                    '<span style="background: #fff3cd; color: #856404; padding: 3px 8px; border-radius: 10px; font-size: 11px;">○ 未使用</span>';
                
                const enterTime = entry.enterTime ? formatDateTime(entry.enterTime) : '-';
                
                html += `
                    <tr style="border-bottom: 1px solid #e0e0e0; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f5f5f5'" onmouseout="this.style.backgroundColor='white'">
                        <td style="padding: 10px;">${entry.id}</td>
                        <td style="padding: 10px;">${entry.roomId || '-'}</td>
                        <td style="padding: 10px;">${entry.username || '-'}</td>
                        <td style="padding: 10px;">${entry.displayId || '-'}</td>
                        <td style="padding: 10px;">${usedBadge}</td>
                        <td style="padding: 10px;">${enterTime}</td>
                        <td style="padding: 10px; text-align: center;">
                            <button onclick="deleteEntryRecord(${entry.id}, '${platform}')" 
                                    style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;"
                                    onmouseover="this.style.background='#c82333'"
                                    onmouseout="this.style.background='#dc3545'">
                                ️ 删除
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            totalCountElement.textContent = `总记录数: ${entryPaginationData[platform].totalCount}`;
        }

        /**
         * 更新分页控件
         */
        function updateEntryPagination(total, pageNum, totalPages, platform) {
            const pagination = entryPaginationData[platform];
            pagination.totalCount = total;
            pagination.currentPage = pageNum;
            pagination.totalPages = totalPages;
            
            const pageInfo = document.getElementById(`entry-page-info-${platform}`);
            const prevBtn = document.getElementById(`entry-prev-btn-${platform}`);
            const nextBtn = document.getElementById(`entry-next-btn-${platform}`);
            
            pageInfo.textContent = `第 ${pageNum} / ${totalPages} 页`;
            prevBtn.disabled = pageNum <= 1;
            nextBtn.disabled = pageNum >= totalPages;
        }

        /**
         * 切换页码
         */
        async function changeEntryPage(direction, platform) {
            const pagination = entryPaginationData[platform];
            const newPage = pagination.currentPage + direction;
            if (newPage < 1 || newPage > pagination.totalPages) return;
            
            pagination.currentPage = newPage;
            
            // 重新查询当前页
            const roomId = document.getElementById(`entry-filter-roomId-${platform}`).value.trim();
            const startTime = document.getElementById(`entry-filter-startTime-${platform}`).value;
            const endTime = document.getElementById(`entry-filter-endTime-${platform}`).value;
            
            // 显示表格loading
            const tbody = document.getElementById(`entry-table-body-${platform}`);
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                        <div class="loading"></div>
                        <p style="margin-top: 15px;">加载中...</p>
                    </td>
                </tr>
            `;
            
            // 构造POST请求体
            const requestBody = {
                platform: platform,
                pageNum: pagination.currentPage,
                pageSize: pagination.pageSize
            };
            
            if (roomId) requestBody.roomId = roomId;
            if (startTime) requestBody.startTime = startTime;
            if (endTime) requestBody.endTime = endTime;
            
            try {
                const response = await fetch('/api/live-entry/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const result = await response.json();
                
                if (result.success) {
                    renderEntryTable(result.data, platform);
                    updateEntryPagination(result.total, result.pageNum, result.totalPages, platform);
                }
            } catch (error) {
                showToast('翻页失败: ' + error.message, 'error');
            }
        }

        /**
         * 重置筛选条件
         */
        function resetEntryFilters(platform) {
            document.getElementById(`entry-filter-roomId-${platform}`).value = '';
            document.getElementById(`entry-filter-startTime-${platform}`).value = '';
            document.getElementById(`entry-filter-endTime-${platform}`).value = '';
            
            showToast('筛选条件已重置', 'success');
        }

        /**
         * 删除单条入场记录
         */
        async function deleteEntryRecord(id, platform) {
            showConfirm({
                title: '删除记录',
                message: `确定要删除ID为 ${id} 的入场记录吗？`,
                type: 'danger',
                icon: '',
                onConfirm: async () => {
                    try {
                        addLog(`正在删除记录 ${id}...`, 'info');
                        
                        // 显示表格loading
                        const tbody = document.getElementById(`entry-table-body-${platform}`);
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="8" style="text-align: center; padding: 40px; color: #999;">
                                    <div class="loading"></div>
                                    <p style="margin-top: 15px;">删除中...</p>
                                </td>
                            </tr>
                        `;
                        
                        const response = await fetch(`/api/live-entry/${id}`, {
                            method: 'DELETE'
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            showToast('删除成功', 'success');
                            addLog('删除成功', 'success');
                            // 重新查询当前页
                            searchEntryRecords(platform);
                        } else {
                            showToast('删除失败', 'error');
                            addLog('删除失败', 'error');
                        }
                    } catch (error) {
                        showToast('删除失败: ' + error.message, 'error');
                        addLog('删除失败: ' + error.message, 'error');
                    }
                }
            });
        }

        /**
         * 格式化日期时间
         */
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            
            // 处理ISO格式的时间字符串
            const date = new Date(dateTimeStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            const second = String(date.getSeconds()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
        }
    </script>
</body>
</html>

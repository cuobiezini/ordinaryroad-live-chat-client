spring:
  application:
    name: ordinaryroad-live-chat-client-example
  # Thymeleaf模板引擎配置
  thymeleaf:
    cache: false  # 开发环境禁用缓存，修改模板后自动生效
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
  # 静态资源配置 - 开发环境禁用缓存
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0  # 开发环境禁用缓存（0秒）
  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/live?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Tomcat服务器配置 - Gzip压缩和UTF-8编码
server:
  compression:
    enabled: true  # 启用Gzip压缩
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml  # 需要压缩的MIME类型
    min-response-size: 1024  # 超过1KB才压缩
  servlet:
    encoding:
      enabled: true      # 启用字符编码配置
      force: true        # 强制设置编码
      charset: UTF-8     # 设置UTF-8编码
      force-request: true  # 强制请求编码
      force-response: true # 强制响应编码
    session:
      timeout: -1  # 会话永不过期（-1表示永不过期）

logging:
  level:
    tech.ordinaryroad: INFO
    io.netty: INFO